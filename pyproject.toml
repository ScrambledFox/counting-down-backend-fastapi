[project]
name = "counting-down-backend"
version = "0.1.0"
description = "A backend service for the counting down website for D and me."
authors = [{ name = "Joris Lodewijks", email = "info@jorislodewijks.nl" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121.1",
  "uvicorn[standard]>=0.38.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "motor>=3.7.1",
  "boto3>=1.41.3",
  "pillow>=12.0.0",
  "openai>=2.0.0",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint-mongodb>=0.4,<0.5",
  "pywebpush==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "mypy>=1.18",
  "types-boto3[s3]>=1.41.3",
  "anyio>=4.0",
  "freezegun>=1.5.5",
  "ruff>=0.14.4",
]
lint = ["ruff>=0.6"]
# Runtime interface client for the background-jobs Lambda container image only.
lambda = ["awslambdaric>=3.1.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["*.pyi"]
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live_ai: opt-in Xiao Bao evaluation that calls the configured OpenAI model"]

[tool.mypy]
python_version = "3.14"
plugins = "pydantic.mypy"

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
