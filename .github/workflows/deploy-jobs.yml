name: Deploy jobs Lambda

# Deploys the background-jobs image (code only; OpenTofu owns configuration, see ADR 0001).
# Disabled until the repository variable JOBS_DEPLOY_ENABLED is "true", so it does nothing
# before the infrastructure exists. Authenticates with GitHub OIDC: no AWS keys in GitHub.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jobs-lambda
  cancel-in-progress: false

jobs:
  test:
    if: vars.JOBS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      MONGO_URL: mongodb://localhost:27017
      MONGO_APP_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --group dev
      - name: Run tests
        run: uv run --no-sync pytest -p no:cacheprovider --disable-warnings

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: jobs-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FUNCTION_NAME: ${{ vars.JOBS_FUNCTION_NAME }}
      ECR_REPOSITORY: ${{ vars.JOBS_ECR_REPOSITORY }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_JOBS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the jobs image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists (immutable tags); reusing it."
          else
            # Lambda requires a single-platform image manifest: no provenance or SBOM attestations.
            docker buildx build --platform linux/arm64 --target jobs \
              --provenance=false --sbom=false --tag "$image" --push .
          fi
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Publish a new version
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" --output text --query LastUpdateStatus
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          version=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
            --description "$IMAGE_TAG" --query Version --output text)
          previous=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name live \
            --query FunctionVersion --output text)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$previous" >> "$GITHUB_ENV"

      - name: Create indexes and smoke-test the new version
        run: |
          for task in ensure_indexes smoke; do
            aws lambda invoke --function-name "$FUNCTION_NAME" --qualifier "$VERSION" \
              --cli-binary-format raw-in-base64-out --payload "{\"task\": \"$task\"}" \
              --query FunctionError --output text "result-$task.json" > "error-$task.txt"
            if [ "$(cat "error-$task.txt")" != "None" ]; then
              echo "::error::Task $task failed on version $VERSION; the live alias was not moved."
              exit 1
            fi
            echo "$task: $(cat "result-$task.json")"
          done
          grep -q '"mongo": "ok"' result-smoke.json

      - name: Move the live alias
        run: |
          aws lambda update-alias --function-name "$FUNCTION_NAME" --name live \
            --function-version "$VERSION" --output text --query FunctionVersion
          {
            echo "### Jobs Lambda deployed"
            echo "- Image: \`$IMAGE_TAG\`"
            echo "- Live version: $VERSION (previous: $PREVIOUS_VERSION)"
            echo "- Roll back: \`aws lambda update-alias --function-name $FUNCTION_NAME --name live --function-version $PREVIOUS_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
