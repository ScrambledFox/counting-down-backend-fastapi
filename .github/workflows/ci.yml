name: CI

# Pre-merge checks for pull requests into master. Test-only: no deployment and no secrets.
# MongoDB runs as a throwaway service container, so tests never touch a shared or production
# database, and the test configuration blanks every credential setting.
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      MONGO_URL: mongodb://localhost:27017
      MONGO_APP_NAME: ci

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Install exactly the locked versions, so lint and tests match local development.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --group dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest -p no:cacheprovider --disable-warnings

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.10

      - name: Check formatting
        run: tofu fmt -check -recursive infra

      # No backend and no AWS credentials: validation is purely static.
      - name: Validate
        run: |
          for root in infra/bootstrap infra/jobs; do
            tofu -chdir="$root" init -backend=false -input=false
            tofu -chdir="$root" validate
          done
